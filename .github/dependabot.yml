version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/envs/dev
    schedule:
      interval: weekly
