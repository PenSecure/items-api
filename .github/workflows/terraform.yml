name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "k8s/**"
      - ".trivyignore"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "k8s/**"
      - ".trivyignore"
      - ".github/workflows/terraform.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: fmt, validate and terraform test (no AWS needed)
        run: make tf-check

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - run: tflint --recursive --chdir=terraform

  trivy-config:
    name: trivy-config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SARIF report (informational, never fails the step)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore
          format: sarif
          output: trivy-config-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-config-results.sarif

      - name: Fail on HIGH/CRITICAL misconfigurations
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
