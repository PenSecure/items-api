apiVersion: v1
kind: ServiceAccount
metadata:
  name: items-api
  # On EKS, annotate with an IRSA / Pod Identity role here if the service
  # ever needs AWS access, e.g. to read from Secrets Manager:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/items-api
# The service never calls the Kubernetes API, so do not mount a token.
automountServiceAccountToken: false
