apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: items-api

labels:
  - pairs:
      app.kubernetes.io/name: items-api
      app.kubernetes.io/part-of: platform
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml
