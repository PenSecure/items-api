# PLACEHOLDER ONLY. Real secret values are never committed to Git.
#
# Intended approach: External Secrets Operator syncs values from
# AWS Secrets Manager into this Secret (see README > Secrets management).
# For this exercise, override locally with:
#   kubectl -n items-api create secret generic items-api-secrets \
#     --from-literal=API_KEY=... --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: items-api-secrets
type: Opaque
stringData:
  API_KEY: "REPLACE_ME"
  DATABASE_URL: "postgres://user:REPLACE_ME@db.example.internal:5432/items"
