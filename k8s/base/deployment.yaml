apiVersion: apps/v1
kind: Deployment
metadata:
  name: items-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below desired capacity during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: items-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: items-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: items-api
      automountServiceAccountToken: false
      # drain (5s) + http shutdown (<=10s) fits inside this window.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: items-api
      containers:
        - name: items-api
          # Tag is set per environment by the Kustomize overlay (CI writes the git SHA).
          image: items-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: items-api-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: items-api-secrets
                  key: API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: items-api-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              # CPU limits can cause throttling; kept because the brief asks
              # for limits. See README trade-offs.
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
